name: WordScene
options:
  bundleIdPrefix: com.erikssonhou
  xcodeVersion: "26.5"
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
settings:
  base:
    DEVELOPMENT_TEAM: JU68L3U235
    MARKETING_VERSION: 1.0.3
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    DEVELOPMENT_LANGUAGE: zh-Hans
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production
targets:
  WordScene:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WordScene/Sources/Shared
      - path: WordScene/Resources
    resources:
      - path: WordScene/Resources
    info:
      path: WordScene/Generated/WordSceneInfo.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.erikssonhou.leximemory.share
            CFBundleURLSchemes:
              - wordscene
        UIBackgroundModes:
          - remote-notification
    entitlements:
      path: WordScene/WordSceneiOS.entitlements
      properties:
        aps-environment: $(APS_ENVIRONMENT)
        com.apple.security.application-groups:
          - group.com.erikssonhou.leximemory
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.erikssonhou.leximemory
        com.apple.developer.icloud-services:
          - CloudKit
    dependencies:
      - target: WordSceneShareExtension
        embed: true
    settings:
      base:
        ENABLE_DEBUG_DYLIB: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.erikssonhou.leximemory
        PRODUCT_NAME: Word Scene
        PRODUCT_MODULE_NAME: WordScene
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        INFOPLIST_KEY_CFBundleDisplayName: 译笺
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        GENERATE_INFOPLIST_FILE: YES
  WordSceneShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WordScene/Sources/ShareExtension
      - path: WordScene/Sources/Shared/Models/LanguageSelection.swift
      - path: WordScene/Sources/Shared/Models/TranslationRecord.swift
      - path: WordScene/Sources/Shared/Services/DebugRawAPIResponseRecorder.swift
      - path: WordScene/Sources/Shared/Services/DeepSeekCredential.swift
      - path: WordScene/Sources/Shared/Services/DeepSeekTranslationClient.swift
      - path: WordScene/Sources/Shared/Services/KeychainCredentialStore.swift
      - path: WordScene/Sources/Shared/Services/ShareExtensionSupport.swift
      - path: WordScene/Sources/Shared/Services/SharedContentExtractor.swift
      - path: WordScene/Sources/Shared/Services/TranslationLanguageDetector.swift
    info:
      path: WordScene/ShareExtension/ShareExtensionInfo.plist
      properties:
        CFBundleDisplayName: 翻译到译笺
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    entitlements:
      path: WordScene/WordSceneShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.erikssonhou.leximemory
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erikssonhou.leximemory.share
        PRODUCT_NAME: Translate to WordScene
        PRODUCT_MODULE_NAME: WordSceneShareExtension
        MARKETING_VERSION: 1.0.3
        CURRENT_PROJECT_VERSION: 1
        APPLICATION_EXTENSION_API_ONLY: YES
        GENERATE_INFOPLIST_FILE: NO
  WordSceneMac:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: WordScene/Sources/Shared
      - path: WordScene/Resources
    resources:
      - path: WordScene/Resources
    entitlements:
      path: WordScene/WordSceneMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.aps-environment: $(APS_ENVIRONMENT)
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.erikssonhou.leximemory
        com.apple.developer.icloud-services:
          - CloudKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erikssonhou.leximemory
        PRODUCT_NAME: Word Scene
        PRODUCT_MODULE_NAME: WordScene
        INFOPLIST_KEY_CFBundleDisplayName: 译笺
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        GENERATE_INFOPLIST_FILE: YES
    postBuildScripts:
      - name: Generate complete macOS AppIcon.icns
        script: scripts/internal/generate_macos_app_icon.sh
        inputFiles:
          - $(SRCROOT)/WordScene/Resources/Assets.xcassets/AppIcon.appiconset/Icon-16-mac.png
          - $(SRCROOT)/WordScene/Resources/Assets.xcassets/AppIcon.appiconset/Icon-16-mac@2x.png
          - $(SRCROOT)/WordScene/Resources/Assets.xcassets/AppIcon.appiconset/Icon-32-mac.png
          - $(SRCROOT)/WordScene/Resources/Assets.xcassets/AppIcon.appiconset/Icon-32-mac@2x.png
          - $(SRCROOT)/WordScene/Resources/Assets.xcassets/AppIcon.appiconset/Icon-128-mac.png
          - $(SRCROOT)/WordScene/Resources/Assets.xcassets/AppIcon.appiconset/Icon-128-mac@2x.png
          - $(SRCROOT)/WordScene/Resources/Assets.xcassets/AppIcon.appiconset/Icon-256-mac.png
          - $(SRCROOT)/WordScene/Resources/Assets.xcassets/AppIcon.appiconset/Icon-256-mac@2x.png
          - $(SRCROOT)/WordScene/Resources/Assets.xcassets/AppIcon.appiconset/Icon-512-mac.png
          - $(SRCROOT)/WordScene/Resources/Assets.xcassets/AppIcon.appiconset/Icon-1024.png
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/AppIcon.icns
  WordSceneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WordScene/Tests
        excludes:
          - CloudKitSchemaInitializationTests.swift
    dependencies:
      - target: WordScene
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erikssonhou.leximemory.tests
        PRODUCT_MODULE_NAME: WordSceneTests
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Word Scene.app/Word Scene"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  WordSceneCloudKitSchemaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WordScene/Tests/CloudKitSchemaInitializationTests.swift
    dependencies:
      - target: WordScene
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erikssonhou.leximemory.cloudkitschematests
        PRODUCT_MODULE_NAME: WordSceneCloudKitSchemaTests
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Word Scene.app/Word Scene"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  WordSceneUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: WordScene/UITests
    dependencies:
      - target: WordScene
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erikssonhou.leximemory.uitests
        PRODUCT_MODULE_NAME: WordSceneUITests
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        TEST_TARGET_NAME: WordScene
        GENERATE_INFOPLIST_FILE: YES
  WordSceneMacUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: WordScene/UITests
    dependencies:
      - target: WordSceneMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erikssonhou.leximemory.macuitests
        PRODUCT_MODULE_NAME: WordSceneMacUITests
        TEST_TARGET_NAME: WordSceneMac
        GENERATE_INFOPLIST_FILE: YES
  WordSceneMacTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: WordScene/Tests
        excludes:
          - CloudKitSchemaInitializationTests.swift
    dependencies:
      - target: WordSceneMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erikssonhou.leximemory.mactests
        PRODUCT_MODULE_NAME: WordSceneMacTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Word Scene.app/Contents/MacOS/Word Scene"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
  WordSceneMacCloudKitSchemaTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: WordScene/Tests/CloudKitSchemaInitializationTests.swift
    dependencies:
      - target: WordSceneMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.erikssonhou.leximemory.maccloudkitschematests
        PRODUCT_MODULE_NAME: WordSceneMacCloudKitSchemaTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Word Scene.app/Contents/MacOS/Word Scene"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
schemes:
  WordScene:
    build:
      targets:
        WordScene: all
    test:
      targets:
        - WordSceneTests
        - WordSceneUITests
  WordSceneMac:
    build:
      targets:
        WordSceneMac: all
    test:
      targets:
        - WordSceneMacTests
        - WordSceneMacUITests
  WordSceneCloudKitSchema:
    build:
      targets:
        WordScene: all
    test:
      targets:
        - WordSceneCloudKitSchemaTests
  WordSceneMacCloudKitSchema:
    build:
      targets:
        WordSceneMac: all
    test:
      targets:
        - WordSceneMacCloudKitSchemaTests
